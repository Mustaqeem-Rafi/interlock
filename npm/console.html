<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Interlock — operator console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Tokens are fixed. This surface is read during an incident; it does not
     follow the operating system into light mode halfway through one. */
  :root{
    --bg:#0c0e11; --surface:#14171c; --border:#262b33; --text:#e6e9ee;
    --muted:#8b949e; --allow:#3fb950; --hold:#d29922; --block:#f85149;
    --sans:"IBM Plex Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
    --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);
       font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  /* Every number mono, every sentence sans. */
  .mono,td.mono,.kpi b,.sik,.ts,.amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
  header{display:flex;align-items:center;gap:16px;padding:14px 20px;
         border-bottom:1px solid var(--border);background:var(--surface);
         position:sticky;top:0;z-index:5}
  header h1{font-size:14px;font-weight:600;margin:0;letter-spacing:.02em}
  header .dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
  header .dot.ok{background:var(--allow)} header .dot.bad{background:var(--hold)}
  header .spacer{flex:1}
  button{font-family:var(--sans);font-size:13px;color:var(--text);background:#1b1f26;
         border:1px solid var(--border);border-radius:6px;padding:5px 11px;cursor:pointer}
  button:hover{border-color:#3a424e}
  button.allow{border-color:#1f6f34;color:#7ee292}
  button.block{border-color:#7d2b28;color:#ff9a94}
  main{padding:20px;max-width:1240px;margin:0 auto}
  section{margin-bottom:26px}
  h2{font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);
     font-weight:600;margin:0 0 10px}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
  .kpi{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:13px 15px}
  .kpi span{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;
            letter-spacing:.07em;margin-bottom:5px}
  .kpi b{font-size:23px;font-weight:500;display:block}
  .kpi.warn b{color:var(--hold)}
  table{width:100%;border-collapse:collapse;background:var(--surface);
        border:1px solid var(--border);border-radius:8px;overflow:hidden}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.07em;
     color:var(--muted);font-weight:600;padding:9px 12px;border-bottom:1px solid var(--border)}
  td{padding:9px 12px;border-bottom:1px solid #1c2027;vertical-align:middle}
  tr:last-child td{border-bottom:none}
  .badge{font-family:var(--mono);font-size:11px;padding:2px 7px;border-radius:4px;
         border:1px solid;letter-spacing:.03em}
  .ALLOW{color:var(--allow);border-color:#1f6f34;background:#0f2a17}
  .HOLD{color:var(--hold);border-color:#7a5a12;background:#2a2110}
  .BLOCK{color:var(--block);border-color:#7d2b28;background:#2c1414}
  .sik{color:var(--muted);font-size:12px}
  .ts{color:var(--muted);font-size:12px}
  .amt{font-weight:500}
  .empty{padding:16px 14px;color:var(--muted);border:1px dashed var(--border);
         border-radius:8px;background:#101317}
  .empty.good{color:#7ee292;border-color:#1f6f34}
  .banner{display:none;padding:11px 15px;border-radius:8px;margin-bottom:18px;
          border:1px solid #7a5a12;background:#2a2110;color:#f0cf7a}
  .banner.on{display:block}
  #gate{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;
        justify-content:center;z-index:20}
  #gate .box{background:var(--surface);border:1px solid var(--border);border-radius:10px;
             padding:22px;width:min(420px,92vw)}
  #gate h2{margin-bottom:6px}
  #gate p{color:var(--muted);margin:0 0 14px}
  input{width:100%;font-family:var(--mono);font-size:13px;padding:9px 11px;
        background:#0f1216;border:1px solid var(--border);border-radius:6px;color:var(--text)}
  .err{color:var(--block);font-size:12px;margin-top:8px;min-height:16px}
  .stream{max-height:340px;overflow:auto}
  tr.form-row td{background:#0f1216}
  .form{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;padding:4px 0}
  .form label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--muted);
              text-transform:uppercase;letter-spacing:.06em;flex:1;min-width:200px}
  .form input{font-family:var(--sans);text-transform:none;letter-spacing:normal}
  .form-actions{display:flex;gap:8px;align-items:center}
  .err.inline{margin-top:0}
</style>
</head>
<body>

<div id="gate">
  <div class="box">
    <h2>Operator console</h2>
    <p>Paste <span class="mono">INTERLOCK_CONSOLE_TOKEN</span>. It is kept for this tab only.</p>
    <input id="token" type="password" autocomplete="off" spellcheck="false" placeholder="bearer token">
    <div class="err" id="gate-err"></div>
    <div style="margin-top:12px"><button id="unlock">Unlock</button></div>
  </div>
</div>

<header>
  <span class="dot" id="dot"></span>
  <h1>Interlock</h1>
  <span class="ts" id="ledger"></span>
  <span class="spacer"></span>
  <span class="ts" id="clock"></span>
  <button id="lock">Lock</button>
</header>

<main>
  <div class="banner" id="banner"></div>

  <section>
    <h2>Now</h2>
    <div class="kpis" id="kpis"></div>
  </section>

  <section>
    <h2>Held — waiting on you</h2>
    <div id="held"></div>
  </section>

  <section>
    <h2>Quarantined — the engine could not decide</h2>
    <div id="quarantine"></div>
  </section>

  <section>
    <h2>Decisions</h2>
    <div id="decisions"></div>
  </section>

  <section>
    <h2>Audit stream</h2>
    <div class="stream" id="stream"></div>
  </section>
</main>

<script>
const $ = (id) => document.getElementById(id);
let TOKEN = sessionStorage.getItem('interlock_token') || '';
let source = null;

const rupees = (minor) =>
  '₹' + (minor / 100).toLocaleString('en-IN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const when = (ms) => new Date(ms).toLocaleString('en-IN', { hour12: false });
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

async function api(path, options = {}) {
  const res = await fetch(path, {
    ...options,
    headers: { 'content-type': 'application/json', authorization: 'Bearer ' + TOKEN, ...(options.headers || {}) },
  });
  if (res.status === 401) { lock('That token was refused.'); throw new Error('unauthorised'); }
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(body?.error?.message || ('HTTP ' + res.status));
  return body;
}

/**
 * 503 is a state, not an error.
 *
 * The gate restarted and is settling intents that were in flight when it died.
 * Saying so is the whole point: an operator who sees a red toast reaches for
 * the runbook, and an operator who reads this sentence waits thirty seconds.
 */
async function health() {
  try {
    const res = await fetch('/health');
    const body = await res.json();
    const recovering = res.status === 503;
    $('dot').className = 'dot ' + (recovering ? 'bad' : 'ok');
    $('banner').className = 'banner' + (recovering ? ' on' : '');
    if (recovering) {
      $('banner').textContent =
        'Reconciling ' + body.outstanding + ' intent' + (body.outstanding === 1 ? '' : 's') +
        ' that were in flight when the gate restarted. Decisions are paused until this finishes.';
    }
  } catch {
    $('dot').className = 'dot bad';
  }
}

function kpis(s) {
  const held = s.counts.HELD || 0, quarantined = s.counts.QUARANTINED || 0;
  const card = (label, value, warn) =>
    '<div class="kpi' + (warn ? ' warn' : '') + '"><span>' + label + '</span><b>' + value + '</b></div>';
  $('kpis').innerHTML =
    card('Needs a person', s.needs_attention, s.needs_attention > 0) +
    card('Held', held, held > 0) +
    card('Quarantined', quarantined, quarantined > 0) +
    card('In progress', s.in_progress) +
    card('Applied · 24h', s.applied_24h.calls) +
    card('Moved · 24h', rupees(s.applied_24h.amount_minor)) +
    card('Audit records', s.audit.records);
}

function rows(list, actions) {
  return '<table><thead><tr><th>SIK</th><th>Tool</th><th>Subject</th><th>Amount</th>' +
    '<th>Since</th><th></th></tr></thead><tbody>' +
    list.map((i) =>
      '<tr><td class="sik">' + esc(i.sik.slice(0, 12)) + '…</td>' +
      '<td class="mono">' + esc(i.tool) + '</td>' +
      '<td class="mono sik">' + esc(i.subject_id) + '</td>' +
      '<td class="amt">' + rupees(i.amount_minor) + '</td>' +
      '<td class="ts">' + when(i.updated_at) + '</td>' +
      '<td style="text-align:right;white-space:nowrap">' + actions(i) + '</td></tr>').join('') +
    '</tbody></table>';
}

async function queues() {
  const held = (await api('/api/held')).intents;
  $('held').innerHTML = held.length === 0
    ? '<div class="empty">Nothing is waiting on a decision.</div>'
    : rows(held, (i) =>
        '<button class="allow" data-op="approve" data-sik="' + i.sik + '">Approve</button> ' +
        '<button class="block" data-op="deny" data-sik="' + i.sik + '">Deny</button>');

  const q = (await api('/api/quarantine')).intents;
  // An empty quarantine queue is success, not emptiness. It means every
  // ambiguous outcome was resolved without a person having to intervene.
  $('quarantine').innerHTML = q.length === 0
    ? '<div class="empty good">Nothing quarantined. Every ambiguous outcome resolved itself.</div>'
    : rows(q, (i) =>
        '<button class="allow" data-op="confirm-applied" data-sik="' + i.sik + '">It happened</button> ' +
        '<button data-op="confirm-not-applied" data-sik="' + i.sik + '">It did not</button>');
}

async function decisions() {
  const list = (await api('/api/decisions?limit=25')).decisions;
  $('decisions').innerHTML = list.length === 0
    ? '<div class="empty">No decisions yet.</div>'
    : '<table><thead><tr><th>Verdict</th><th>SIK</th><th>Gates</th><th>When</th></tr></thead><tbody>' +
      list.map((d) => {
        const failing = d.gates.find((g) => g.verdict !== 'ALLOW');
        return '<tr><td><span class="badge ' + esc(d.verdict) + '">' + esc(d.verdict) + '</span></td>' +
          '<td class="sik">' + esc(d.sik.slice(0, 12)) + '…</td>' +
          '<td class="mono sik">' + esc(failing ? failing.gate + ' · ' + failing.reason_code : d.gates.length + ' passed') + '</td>' +
          '<td class="ts">' + when(d.decided_at) + '</td></tr>';
      }).join('') + '</tbody></table>';
}

function stream() {
  if (source) source.close();
  // EventSource cannot send an Authorization header, so the token rides as a
  // query parameter on this one route. It is the same shared secret either
  // way; noted here so nobody mistakes it for a second mechanism.
  source = new EventSource('/api/stream?token=' + encodeURIComponent(TOKEN));
  const box = $('stream');
  source.addEventListener('audit', (e) => {
    const r = JSON.parse(e.data);
    const line = document.createElement('div');
    line.innerHTML = '<span class="ts">' + when(r.ts) + '</span> ' +
      '<span class="mono">' + esc(r.kind) + '</span> ' +
      '<span class="sik mono">#' + r.seq + '</span>';
    box.prepend(line);
    while (box.childElementCount > 200) box.lastElementChild.remove();
    refresh();
  });
  source.addEventListener('hello', () => { box.innerHTML = ''; });
}

/**
 * The reason is the point, so it gets a real field.
 *
 * This was prompt() first. Two things were wrong with that: a modal blocks the
 * whole page while an operator decides how to word something that becomes a
 * permanent audit record, and errors came back through alert(), which loses
 * the field values and makes the operator retype everything. The form opens in
 * the row it belongs to and keeps what was typed when the server says no.
 */
function closeForms() {
  document.querySelectorAll('tr.form-row').forEach((r) => r.remove());
}

function openForm(button) {
  const { sik, op } = button.dataset;
  const row = button.closest('tr');
  const already = row.nextElementSibling;
  closeForms();
  if (already && already.classList.contains('form-row')) return;

  const wantsEntity = op === 'confirm-applied';
  const verb = { approve: 'Approve', deny: 'Deny',
    'confirm-applied': 'Record as applied', 'confirm-not-applied': 'Record as not applied' }[op];

  const tr = document.createElement('tr');
  tr.className = 'form-row';
  tr.innerHTML =
    '<td colspan="6"><div class="form">' +
      '<label>Why? Written to the audit log verbatim.' +
        '<input class="reason" autocomplete="off" placeholder="e.g. confirmed with the customer on ticket 4471"></label>' +
      (wantsEntity
        ? '<label>Which rail entity did you find?' +
          '<input class="entity" autocomplete="off" spellcheck="false" placeholder="rfnd_..."></label>'
        : '') +
      '<label>Your name<input class="operator" autocomplete="off" placeholder="who is deciding"></label>' +
      '<div class="form-actions">' +
        '<button class="' + (op === 'deny' ? 'block' : 'allow') + ' go">' + verb + '</button>' +
        '<button class="cancel">Cancel</button>' +
        '<span class="err inline"></span>' +
      '</div>' +
    '</div></td>';
  row.after(tr);
  tr.querySelector('.reason').focus();

  tr.querySelector('.cancel').addEventListener('click', closeForms);
  tr.querySelector('.go').addEventListener('click', async () => {
    const reason = tr.querySelector('.reason').value.trim();
    const err = tr.querySelector('.err');
    if (reason === '') { err.textContent = 'A reason is required.'; return; }
    const body = { reason, operator: tr.querySelector('.operator').value.trim() || 'console' };
    if (wantsEntity) {
      const entity = tr.querySelector('.entity').value.trim();
      if (entity === '') { err.textContent = 'The rail entity id is required.'; return; }
      body.rail_entity_id = entity;
    }
    err.textContent = '';
    try {
      await api('/api/intents/' + encodeURIComponent(sik) + '/' + op, {
        method: 'POST', body: JSON.stringify(body),
      });
      closeForms();
      await refresh();
    } catch (error) {
      // Keep what was typed. Retyping a justification is how people stop
      // writing real ones.
      err.textContent = error.message;
    }
  });
}

document.addEventListener('click', (e) => {
  const button = e.target.closest('button[data-op]');
  if (button) openForm(button);
});

async function refresh() {
  await health();
  try {
    kpis(await api('/api/summary'));
    await queues();
    await decisions();
    $('clock').textContent = 'updated ' + new Date().toLocaleTimeString('en-IN', { hour12: false });
  } catch { /* lock() has already run, or the gate is briefly down */ }
}

function lock(message) {
  TOKEN = '';
  sessionStorage.removeItem('interlock_token');
  if (source) { source.close(); source = null; }
  $('gate').style.display = 'flex';
  $('gate-err').textContent = message || '';
}

async function unlock() {
  const value = $('token').value.trim();
  if (value === '') return;
  TOKEN = value;
  try {
    await api('/api/summary');
  } catch { return; }
  sessionStorage.setItem('interlock_token', value);
  $('gate').style.display = 'none';
  $('token').value = '';
  await refresh();
  stream();
}

$('unlock').addEventListener('click', () => void unlock());
$('token').addEventListener('keydown', (e) => { if (e.key === 'Enter') void unlock(); });
$('lock').addEventListener('click', () => lock(''));

if (TOKEN) { $('gate').style.display = 'none'; void refresh().then(stream); }
setInterval(() => void health(), 5000);
</script>
</body>
</html>
