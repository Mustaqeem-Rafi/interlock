name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # eslint plus the gate line budget — see scripts/check-thin.mjs.
      - name: Lint
        run: pnpm run lint

      # tsc --build, not --noEmit: with project references TypeScript rejects
      # --noEmit (TS6310), and a real build also proves declaration emit works
      # across package boundaries.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test
