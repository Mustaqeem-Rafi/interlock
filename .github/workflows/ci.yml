name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint, typecheck, test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # eslint plus the gate line budget — see scripts/check-thin.mjs.
      - name: Lint
        run: pnpm run lint

      # tsc --build, not --noEmit: with project references TypeScript rejects
      # --noEmit (TS6310), and a real build also proves declaration emit works
      # across package boundaries.
      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

  package:
    name: npm package (packed, installed, run)
    needs: check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      # Bundles the three workspace packages into the two binaries. The
      # workspace depends on itself with `workspace:*`, which no consumer can
      # resolve, so what is published is the bundle and never the raw dist.
      - name: Build the publishable package
        run: pnpm run build:npm

      # Everything below deliberately leaves the repo behind. It installs the
      # tarball into an empty directory with plain npm, so nothing resolves
      # through the workspace and a missing dependency or a stale `workspace:*`
      # shows up here instead of in a stranger's terminal.
      - name: Pack and install as a consumer would
        run: |
          set -euo pipefail
          TARBALL="$(cd npm && npm pack --silent)"
          mkdir -p "$RUNNER_TEMP/consumer"
          cp "npm/$TARBALL" "$RUNNER_TEMP/consumer/"
          cd "$RUNNER_TEMP/consumer"
          npm init -y >/dev/null
          npm install --no-audit --no-fund "./$TARBALL"
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"

      - name: The binaries are on PATH and run
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          ./node_modules/.bin/interlock-mcp --version
          ./node_modules/.bin/interlock-init --version

      # The README's first instruction, executed. A refund applies, the same
      # call made twice moves money once, and a refund past the mandate is
      # refused as a final answer rather than as a protocol error an agent
      # would retry. If npx is broken, this is where it is discovered.
      - name: A stock MCP client drives the installed binary
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/consumer"
          cp node_modules/interlock-mcp/examples/mandate.yaml ./mandate.yaml
          npm install --no-audit --no-fund @modelcontextprotocol/sdk@^1.30.0
          node "$GITHUB_WORKSPACE/scripts/smoke-npm.mjs"             ./node_modules/.bin/interlock-mcp ./mandate.yaml

      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: interlock-mcp-tarball
          path: npm/*.tgz

  results:
    name: results (machine-written)
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      # Both generators run against the mock rail. No credential is present in
      # this job and none is needed: the benchmark replays model responses from
      # the committed cache, so a fork with no secrets gets the same numbers.
      - name: Chaos matrix
        run: node packages/chaos/dist/matrix.js --trials 4 --full

      - name: Benchmark
        run: node packages/bench/dist/cli.js --rail mock --harness both

      - name: Compose RESULTS.md
        run: pnpm run results

      # RESULTS.md is written here and nowhere else. A number in it can always
      # be traced to the command above that produced it, which is the point of
      # not letting a person type into it.
      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: results
          path: |
            RESULTS.md
            RESULTS.bench.md
            RESULTS.chaos.md

      - name: Commit regenerated results
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add RESULTS.md RESULTS.bench.md RESULTS.chaos.md
          if git diff --cached --quiet; then
            echo "results unchanged"
          else
            git commit -m "chore(results): regenerate from CI [skip ci]"
            git push
          fi
